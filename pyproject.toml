[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iflow-mcp-catalog"
version = "0.1.0"
description = "FastMCP 3.1.0 catalog: GitHub org MCP fork index (iflow-mcp) with SOTA webapp"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "sandraschi", email = "sandraschipal@gmail.com" }]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.30.0",
    "fastapi>=0.115.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0,<0.17",
]

[project.urls]
Homepage = "https://github.com/sandraschi/iflow-mcp-catalog"
Repository = "https://github.com/sandraschi/iflow-mcp-catalog"
Issues = "https://github.com/sandraschi/iflow-mcp-catalog/issues"

[project.scripts]
iflow-mcp-catalog = "iflow_mcp_catalog.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S104", "S310", "S311", "S314", "S608", "S108", "S603", "S301", "S103", "S112", "S105", "S607", "S701", "S102", "S307", "S324", "ASYNC230", "B008", "B904", "B025", "B019", "B023", "C901", "UP035", "RUF006", "N806", "E501", "F841", "PLW1510", "BLE001", "RUF022", "E402", "F811", "B006", "B007", "RUF059", "RUF001", "RUF002", "S110", "RUF012", "DTZ005", "DTZ006", "DTZ001", "E741", "SIM115", "SIM102", "RUF100", "F401", "D103", "D101", "F821", "TRY002", "S101", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
