[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iflow-mcp-catalog"
version = "0.1.0"
description = "FastMCP 3.1.0 catalog: GitHub org MCP fork index (iflow-mcp) with SOTA webapp"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "sandraschi", email = "sandra@sandraschi.dev" }]
dependencies = [
    "fastmcp>=3.1.0,<4",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.30.0",
    "fastapi>=0.115.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/sandraschi/iflow-mcp-catalog"
Repository = "https://github.com/sandraschi/iflow-mcp-catalog"
Issues = "https://github.com/sandraschi/iflow-mcp-catalog/issues"

[project.scripts]
iflow-mcp-catalog = "iflow_mcp_catalog.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
